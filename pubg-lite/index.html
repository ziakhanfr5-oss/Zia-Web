<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG Lite 2D</title>
<style>
  body { margin:0; background:#0a0a0a; overflow:hidden; font-family:'Arial',sans-serif; }
  canvas { display:block; background:#1a1a1a; }
  #ui {
    position:absolute; top:10px; left:10px; color:#0ff; font-size:16px;
    text-shadow:0 0 10px #0ff; line-height:1.6;
  }
  #controls {
    position:absolute; bottom:20px; width:100%; display:flex; justify-content:space-between;
    padding:0 20px; box-sizing:border-box;
  }
 .btn {
    width:60px; height:60px; background:rgba(0,255,255,0.2); border:2px solid #0ff;
    border-radius:50%; color:#0ff; font-size:20px; display:flex; align-items:center;
    justify-content:center; touch-action:none; user-select:none;
  }
  #gameOver {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.9); color:#0ff; padding:30px; text-align:center;
    border:2px solid #0ff; display:none;
  }
</style>
</head>
<body>
<div id="ui">
  Score: <span id="score">0</span><br>
  HP: <span id="hp">100</span><br>
  Weapon: <span id="weapon">Pistol</span><br>
  Ammo: <span id="ammo">15/15</span>
</div>
<canvas id="game"></canvas>
<div id="controls">
  <div class="btn" id="left">◀</div>
  <div class="btn" id="shoot">🔥</div>
  <div class="btn" id="right">▶</div>
</div>
<div id="gameOver">
  <h2>GAME OVER</h2>
  <p>Score: <span id="finalScore">0</span></p>
  <button onclick="location.reload()">Restart</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur=0.1){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq;
  osc.connect(gain); gain.connect(audioCtx.destination);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

let player = {x:canvas.width/2, y:canvas.height/2, size:18, hp:100, speed:4};
let bullets = [], enemies = [], walls = [], healthPacks = [];
let score = 0, weapon = 'pistol', ammo = 15, maxAmmo = 15, reloading = false;
let keys = {};

const weapons = {
  pistol: {damage:20, ammo:15, reload:1000, fireRate:300},
  shotgun: {damage:50, ammo:6, reload:2000, fireRate:800},
  rifle: {damage:35, ammo:30, reload:1500, fireRate:150}
};
let lastShot = 0;

// Create walls
for(let i=0; i<5; i++){
  walls.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    w:100, h:20
  });
}

// Controls
window.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if(e.key==='1') switchWeapon('pistol');
  if(e.key==='2') switchWeapon('shotgun');
  if(e.key==='3') switchWeapon('rifle');
  if(e.key==='r') reload();
});
window.addEventListener('keyup', e=>keys[e.key]=false);
window.addEventListener('click', shoot);

// Mobile
document.getElementById('left').addEventListener('touchstart', ()=>keys['ArrowLeft']=true);
document.getElementById('left').addEventListener('touchend', ()=>keys['ArrowLeft']=false);
document.getElementById('right').addEventListener('touchstart', ()=>keys['ArrowRight']=true);
document.getElementById('right').addEventListener('touchend', ()=>keys['ArrowRight']=false);
document.getElementById('shoot').addEventListener('touchstart', shoot);

function switchWeapon(w){
  weapon = w;
  ammo = weapons[w].ammo;
  maxAmmo = ammo;
  playSound(800, 0.05);
}

function reload(){
  if(reloading || ammo===maxAmmo) return;
  reloading = true;
  playSound(400, 0.3);
  setTimeout(()=>{
    ammo = maxAmmo;
    reloading = false;
  }, weapons[weapon].reload);
}

function shoot(){
  let now = Date.now();
  if(now-lastShot < weapons[weapon].fireRate || ammo<=0 || reloading) return;
  lastShot = now;
  ammo--;

  playSound(weapon==='shotgun'?200:600, 0.08);

  if(weapon==='shotgun'){
    for(let i=-2; i<=2; i++){
      bullets.push({x:player.x, y:player.y, vx:i*1.5, vy:-8, size:4});
    }
  } else {
    bullets.push({x:player.x, y:player.y, vx:0, vy:-10, size:5});
  }
}

function spawnEnemy(){
  let side = Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=0;y=Math.random()*canvas.height;}
  if(side===1){x=canvas.width;y=Math.random()*canvas.height;}
  if(side===2){x=Math.random()*canvas.width;y=0;}
  if(side===3){x=Math.random()*canvas.width;y=canvas.height;}
  enemies.push({x:x, y:y, size:18, speed:1.5+Math.random()*2, hp:50});
}

function spawnHealth(){
  healthPacks.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:15
  });
}

setInterval(spawnEnemy, 1500);
setInterval(spawnHealth, 8000);

function gameLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Move player
  if(keys['ArrowLeft']||keys['a']) player.x-=player.speed;
  if(keys['ArrowRight']||keys['d']) player.x+=player.speed;
  if(keys['ArrowUp']||keys['w']) player.y-=player.speed;
  if(keys['ArrowDown']||keys['s']) player.y+=player.speed;

  // Keep in bounds
  player.x=Math.max(player.size,Math.min(canvas.width-player.size,player.x));
  player.y=Math.max(player.size,Math.min(canvas.height-player.size,player.y));

  // Draw walls
  ctx.fillStyle='#444';
  walls.forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h));

  // Draw player
  ctx.fillStyle='#0ff';
  ctx.shadowBlur=15; ctx.shadowColor='#0ff';
  ctx.beginPath(); ctx.arc(player.x,player.y,player.size,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // Bullets
  ctx.fillStyle='#ff0';
  bullets.forEach((b,i)=>{
    b.x+=b.vx; b.y+=b.vy;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.size,0,Math.PI*2); ctx.fill();

    // Wall collision
    walls.forEach(w=>{
      if(b.x>w.x && b.x<w.x+w.w && b.y>w.y && b.y<w.y+w.h){
        bullets.splice(i,1);
      }
    });

    if(b.y<0||b.y>canvas.height||b.x<0||b.x>canvas.width) bullets.splice(i,1);
  });

  // Enemies
  enemies.forEach((e,i)=>{
    // Move towards player
    let angle = Math.atan2(player.y-e.y, player.x-e.x);
    e.x += Math.cos(angle)*e.speed;
    e.y += Math.sin(angle)*e.speed;

    ctx.fillStyle='#f00';
    ctx.beginPath(); ctx.arc(e.x,e.y,e.size,0,Math.PI*2); ctx.fill();

    // Player collision
    if(Math.hypot(player.x-e.x, player.y-e.y)<player.size+e.size){
      player.hp-=15;
      enemies.splice(i,1);
      playSound(150, 0.2);
    }

    // Bullet collision
    bullets.forEach((b,j)=>{
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.size+b.size){
        e.hp-=weapons[weapon].damage;
        bullets.splice(j,1);
        if(e.hp<=0){
          score+=20;
          enemies.splice(i,1);
          playSound(1000, 0.1);
        }
      }
    });
  });

  // Health packs
  ctx.fillStyle='#0f0';
  healthPacks.forEach((h,i)=>{
    ctx.beginPath(); ctx.arc(h.x,h.y,h.size,0,Math.PI*2); ctx.fill();
    if(Math.hypot(player.x-h.x, player.y-h.y)<player.size+h.size){
      player.hp=Math.min(100,player.hp+30);
      healthPacks.splice(i,1);
      playSound(1200, 0.2);
    }
  });

  // Update UI
  document.getElementById('score').innerText=score;
  document.getElementById('hp').innerText=player.hp;
  document.getElementById('weapon').innerText=weapon.toUpperCase();
  document.getElementById('ammo').innerText=`${ammo}/${maxAmmo} ${reloading?'[RELOADING]':''}`;

  if(player.hp<=0){
    document.getElementById('finalScore').innerText=score;
    document.getElementById('gameOver').style.display='block';
    return;
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
