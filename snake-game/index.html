<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🐍 NEON SNAKE 🐍</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">Score</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="label">Best</span>
                    <span class="value" id="bestScore">0</span>
                </div>
                <div class="stat">
                    <span class="label">Level</span>
                    <span class="value" id="level">1</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <button class="control-btn" id="upBtn">⬆</button>
            <button class="control-btn" id="leftBtn">⬅</button>
            <button class="control-btn" id="downBtn">⬇</button>
            <button class="control-btn" id="rightBtn">➡</button>
        </div>

        <div class="buttons">
            <button id="startBtn" class="start-btn">▶ Start Game</button>
            <button id="pauseBtn" class="pause-btn">⏸ Pause</button>
        </div>

        <div class="instructions">
            <p>🎮 <strong>Controls:</strong> Arrow Keys, Swipe, or On-screen Buttons</p>
            <p>🍔 <strong>Goal:</strong> Eat yellow food to grow and increase score!</p>
            <p>⚠️ <strong>Avoid:</strong> Walls and your own body</p>
        </div>

        <div class="game-over hidden" id="gameOverScreen">
            <h2>GAME OVER</h2>
            <div class="game-over-stats">
                <p>Your Score: <span id="finalScore">0</span></p>
                <p>Best Score: <span id="bestFinal">0</span></p>
            </div>
            <button id="restartBtn" class="restart-btn">🔄 Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
