<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tic-Tac-Toe (Simple)</title>
  <style>
    /* Basic page layout */
    :root{
      --bg: #0f172a;
      --card: #0b1220;
      --accent: #0ea5a4;
      --muted: #94a3b8;
      --x-color: #fb7185;
      --o-color: #60a5fa;
      --win-color: #f59e0b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #020617 0%, var(--bg) 100%);
      color:#e6eef8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .container{
      width:360px;
      max-width:95vw;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:18px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.03);
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    h1{
      font-size:18px;
      margin:0;
      letter-spacing:0.4px;
    }
    .status{
      font-size:13px;
      color:var(--muted);
    }

    /* Board */
    .board{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:8px;
      margin: 8px 0 14px;
      user-select:none;
    }
    .cell{
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));
      height:95px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:8px;
      cursor:pointer;
      font-size:48px;
      font-weight:700;
      transition: transform 120ms ease, box-shadow 120ms;
      color:#e6eef8;
      border:1px solid rgba(255,255,255,0.02);
      position:relative;
    }
    .cell:hover{ transform: translateY(-4px); box-shadow: 0 8px 20px rgba(2,6,23,0.6); }
    .cell.disabled{ cursor:default; opacity:0.9; transform:none; box-shadow:none; }

    .cell.x{ color: var(--x-color); }
    .cell.o{ color: var(--o-color); }

    .controls{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
    }
    .btn{
      appearance:none;
      border:0;
      padding:8px 12px;
      border-radius:8px;
      font-weight:600;
      cursor:pointer;
      background:var(--accent);
      color:#042027;
      box-shadow: 0 6px 16px rgba(14,165,164,0.14);
    }
    .btn.ghost{
      background:transparent;
      color:var(--muted);
      border:1px solid rgba(255,255,255,0.03);
    }

    /* highlight winning cells */
    .cell.win{
      outline: 3px solid rgba(245,158,11,0.12);
      box-shadow: 0 10px 30px rgba(245,158,11,0.09);
      transform: scale(1.02);
      background: linear-gradient(180deg, rgba(245,158,11,0.03), rgba(245,158,11,0.01));
    }

    .footer{
      margin-top:12px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }

    /* Responsive adjustments */
    @media (max-width:380px){
      .cell{ height:80px; font-size:40px; }
    }
  </style>
</head>
<body>
  <div class="container" role="application" aria-label="Tic Tac Toe game">
    <div class="header">
      <div>
        <h1>Tic‑Tac‑Toe</h1>
        <div class="status" id="status">Player
