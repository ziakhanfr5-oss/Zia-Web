<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherPro</title>
<link rel="stylesheet" href="style.css">
<meta property="og:title" content="Zia Weather Dashboard">
<meta property="og:description" content="Get weather updates for any city">
<meta property="og:image" content="https://ziakhanfr5-oss.github.io/preview.jpg">
<meta property="og:url" content="https://ziakhanfr5-oss.github.io/">
<meta property="og:type" content="website">
</head>
<body>
  <div class="container">
    <h1>🌤 WeatherPro</h1>
    
    <button id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    
    <div class="search-box">
      <input type="text" id="city" placeholder="Enter city name">
      <button onclick="getWeather()">Search</button>
    </div>

    <div id="result" class="weather-card hide"></div>
  </div>

<script src="script.js"></script>
</body>
</html>
