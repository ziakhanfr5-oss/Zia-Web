<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tic-Tac-Toe (Simple)</title>
  <style>
    :root{
      --bg: #0f172a;
      --card: #0b1220;
      --accent: #0ea5a4;
      --muted: #94a3b8;
      --x-color: #fb7185;
      --o-color: #60a5fa;
      --win-color: #f59e0b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #020617 0%, var(--bg) 100%);
      color:#e6eef8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
   .container{
      width:360px;
      max-width:95vw;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:18px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.03);
    }
   .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    h1{font-size:18px;margin:0;letter-spacing:0.4px;}
   .status{font-size:13px;color:var(--muted);}
   .board{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:8px;
      margin: 8px 0 14px;
      user-select:none;
    }
   .cell{
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));
      height:95px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:8px;
      cursor:pointer;
      font-size:48px;
      font-weight:700;
      transition: transform 120ms ease, box-shadow 120ms;
      color:#e6eef8;
      border:1px solid rgba(255,255,255,0.02);
      position:relative;
    }
   .cell:hover{ transform: translateY(-4px); box-shadow: 0 8px 20px rgba(2,6,23,0.6); }
   .cell.disabled{ cursor:default; opacity:0.9; transform:none; box-shadow:none; }
   .cell.x{ color: var(--x-color); }
   .cell.o{ color: var(--o-color); }
   .controls{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
    }
   .btn{
      appearance:none;
      border:0;
      padding:8px 12px;
      border-radius:8px;
      font-weight:600;
      cursor:pointer;
      background:var(--accent);
      color:#042027;
      box-shadow: 0 6px 16px rgba(14,165,164,0.14);
    }
   .btn.ghost{
      background:transparent;
      color:var(--muted);
      border:1px solid rgba(255,255,255,0.03);
    }
   .cell.win{
      outline: 3px solid rgba(245,158,11,0.12);
      box-shadow: 0 10px 30px rgba(245,158,11,0.09);
      transform: scale(1.02);
      background: linear-gradient(180deg, rgba(245,158,11,0.03), rgba(245,158,11,0.01));
    }
   .footer{
      margin-top:12px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }
    @media (max-width:380px){
     .cell{ height:80px; font-size:40px; }
    }
  </style>
</head>
<body>
  <div class="container" role="application" aria-label="Tic Tac Toe game">
    <div class="header">
      <div>
        <h1>Tic‑Tac‑Toe</h1>
        <div class="status" id="status">Player X's turn</div>
      </div>
      <button class="btn ghost" id="reset">Reset</button>
    </div>
    <div class="board" id="board"></div>
    <div class="controls">
      <div class="footer">Tap a cell to play</div>
    </div>
  </div>
  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');
    let board = Array(9).fill(null);
    let turn = 'X';
    let gameOver = false;

    function render(){
      boardEl.innerHTML = '';
      board.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if(val === 'X') cell.classList.add('x');
        if(val === 'O') cell.classList.add('o');
        cell.textContent = val || '';
        cell.onclick = () => makeMove(i);
        boardEl.appendChild(cell);
      });
    }

    function makeMove(i){
      if(board[i] || gameOver) return;
      board[i] = turn;
      if(checkWin(turn)){
        statusEl.textContent = `Player ${turn} wins!`;
        gameOver = true;
        highlightWin(turn);
      } else if(board.every(Boolean)){
        statusEl.textContent = "It's a draw!";
        gameOver = true;
      } else {
        turn = turn === 'X'? 'O' : 'X';
        statusEl.textContent = `Player ${turn}'s turn`;
      }
      render();
    }

    function checkWin(p){
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      return wins.some(line => line.every(i => board[i] === p));
    }

    function highlightWin(p){
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      const winLine = wins.find(line => line.every(i => board[i] === p));
      if(winLine){
        winLine.forEach(i => boardEl.children[i].classList.add('win'));
      }
    }

    resetBtn.onclick = () => {
      board = Array(9).fill(null);
      turn = 'X';
      gameOver = false;
      statusEl.textContent = `Player ${turn}'s turn`;
      render();
    };

    render();
  </script>
</body>
</html>
