<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherPro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🌤️ WeatherPro</h1>
    <button class="toggle" onclick="toggleTheme()">🌙 Dark</button>
  </div>

  <div class="search-box">
    <input id="city" type="text" placeholder="Search city...">
    <button onclick="getWeather()">Search</button>
  </div>

  <div id="result"></div>
</div>

<script src="script.js"></script>

<!-- Debug Console for Phone -->

</body>
</html>
