<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F3QTPV1XTQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F3QTPV1XTQ');
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #666;
      font-size: 14px;
    }

    .search-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: #667eea;
    }

    .search-btn, .location-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .search-btn {
      background: #667eea;
      color: white;
    }

    .search-btn:hover {
      background: #5568d3;
    }

    .location-btn {
      background: #f0f0f0;
      color: #333;
    }

    .location-btn:hover {
      background: #e0e0e0;
    }

    .weather-container {
      text-align: center;
    }

    #cityName {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }

    #temperature {
      font-size: 60px;
      font-weight: 700;
      color: #667eea;
      margin: 10px 0;
    }

    #weatherDescription {
      font-size: 18px;
      color: #666;
      text-transform: capitalize;
      margin-bottom: 20px;
    }

    .weather-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .weather-details div {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      color: #333;
    }

    .error-message {
      color: #d32f2f;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Weather Dashboard</h1>
      <p>Get weather updates for any city</p>
    </header>

    <div class="search-section">
      <input type="text" id="searchInput" placeholder="Enter city name..." class="search-input">
      <button id="searchBtn" class="search-btn">Search</button>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div id="weatherContainer" class="weather-container" style="display: none;">
      <div id="cityName"></div>
      <div id="temperature"></div>
      <div id="weatherDescription"></div>

      <div class="weather-details">
        <div id="feelsLike"></div>
        <div id="humidity"></div>
        <div id="wind"></div>
        <div id="pressure"></div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "YOUR_API_KEY_HERE"; // Yahan apni OpenWeatherMap API key daalo
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const weatherContainer = document.getElementById('weatherContainer');
    const errorMessage = document.getElementById('errorMessage');

    searchBtn.addEventListener('click', getWeather);
    searchInput.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') getWeather();
    });

    async function getWeather() {
      const city = searchInput.value.trim();
      if(!city) return;

      try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`);
        
        if(!response.ok) throw new Error('City not found');
        
        const data = await response.json();
        displayWeather(data);
        errorMessage.style.display = 'none';
        
        // GA event track karo
        gtag('event', 'search_city', {
          'city_name': city
        });
        
      } catch(error) {
        errorMessage.textContent = error.message;
        errorMessage.style.display = 'block';
        weatherContainer.style.display = 'none';
      }
    }

    function displayWeather(data) {
      weatherContainer.style.display = 'block';
      
      document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
      document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}°C`;
      document.getElementById('weatherDescription').textContent = data.weather[0].description;
      document.getElementById('feelsLike').innerHTML = `<strong>Feels Like</strong><br>${Math.round(data.main.feels_like)}°C`;
      document.getElementById('humidity').innerHTML = `<strong>Humidity</strong><br>${data.main.humidity}%`;
      document.getElementById('wind').innerHTML = `<strong>Wind</strong><br>${data.wind.speed} km/h`;
      document.getElementById('pressure').innerHTML = `<strong>Pressure</strong><br>${data.main.pressure} hPa`;
    }
  </script>
</body>
</html>
