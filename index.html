<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instant AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Space Grotesk',sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: linear-gradient(135deg, #0f0f1a 0%, #1e1b4b 100%);
  color: #fff;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  overflow: hidden;
}

.chat-container {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  max-width: 800px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(40px);
  border: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

@media (min-width: 768px) {
  body { padding: 20px; }
 .chat-container {
    height: 90vh;
    height: 90dvh;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
  }
}

.header {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  text-align: center;
  flex-shrink: 0;
}

.header h1 {
  font-size: 20px;
  background: linear-gradient(135deg, #fff, #c4b5fd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header p {
  color:#a1a1aa;
  font-size:12px;
  margin-top:4px;
}

.key-setup {
  padding: 16px;
  background: rgba(239, 68, 68, 0.1);
  border-bottom: 1px solid rgba(239, 68, 68, 0.3);
  flex-shrink: 0;
}

.key-setup p {
  color:#fca5a5;
  font-size:13px;
  line-height: 1.4;
}

.key-setup input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #fff;
  margin-top: 10px;
  outline: none;
  font-size: 14px;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
}

.msg {
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 85%;
  line-height: 1.5;
  word-wrap: break-word;
  font-size: 14px;
}

.user-msg {
  background: linear-gradient(135deg, #6366f1, #d946ef);
  align-self: flex-end;
}

.ai-msg {
  background: rgba(255,255,255,0.08);
  align-self: flex-start;
}

.input-area {
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  background: rgba(15,15,26,0.8);
  backdrop-filter: blur(20px);
}

input {
  flex: 1;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #fff;
  font-size: 15px;
  outline: none;
}

input::placeholder {
  color: #a1a1aa;
}

button {
  padding: 14px 20px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #6366f1, #d946ef);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
}

button:active {
  transform: scale(0.95);
}

button:disabled {
  opacity: 0.5;
}

.typing {
  display: none;
  color: #a1a1aa;
  font-style: italic;
  padding: 0 16px 8px;
  font-size: 13px;
  flex-shrink: 0;
}
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <h1>⚡ Instant AI</h1>
    <p>Powered by Groq • Llama 3.3 70B</p>
  </div>

  <div class="key-setup" id="keySetup">
    <p>⚠️ API key code me safe nahi hoti. Apni Groq key yahan daalo, ye sirf tumhare phone me save hogi.</p>
    <input id="apiKeyInput" type="password" placeholder="gsk_xxxxxxxxxxxxx" autocomplete="off">
    <button onclick="saveKey()" style="width:100%;margin-top:10px;">Save & Start</button>
    <p style="color:#a1a1aa;font-size:12px;margin-top:10px">Key nahi hai? <a href="https://console.groq.com/keys" target="_blank" style="color:#c4b5fd;">Free key banao</a></p>
  </div>

  <div class="chat-box" id="chatBox" style="display:none;">
    <div class="msg ai-msg">Hello! Key set ho gayi hai. Ab pucho jo puchna hai.</div>
  </div>

  <div class="input-area" id="inputArea" style="display:none;">
    <input id="userInput" placeholder="Type your question..." onkeypress="if(event.key==='Enter')sendMsg()" autocomplete="off">
    <button id="sendBtn" onclick="sendMsg()">Send</button>
  </div>
  <div class="typing" id="typing">AI is typing...</div>
</div>

<script>
let API_KEY = localStorage.getItem('groq_key');

window.onload = function() {
  if(API_KEY) {
    document.getElementById('keySetup').style.display = 'none';
    document.getElementById('chatBox').style.display = 'flex';
    document.getElementById('inputArea').style.display = 'flex';
  }
}

function saveKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if(!key.startsWith('gsk_')) {
    alert('Invalid key. Key gsk_ se start honi chahiye');
    return;
  }
  localStorage.setItem('groq_key', key);
  API_KEY = key;
  document.getElementById('keySetup').style.display = 'none';
  document.getElementById('chatBox').style.display = 'flex';
  document.getElementById('inputArea').style.display = 'flex';
}

async function sendMsg() {
  if(!API_KEY) return alert('Pehle API key daalo');

  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if(!msg) return;

  addMsg(msg, 'user');
  input.value = '';
  document.getElementById('typing').style.display = 'block';
  document.getElementById('sendBtn').disabled = true;

  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: [{role: "user", content: msg}],
        temperature: 0.7
      })
    });

    const data = await res.json();
    if(data.error) throw new Error(data.error.message);

    const reply = data.choices[0].message.content;
    addMsg(reply, 'ai');

  } catch(e) {
    addMsg("Error: " + e.message, 'ai');
  }

  document.getElementById('typing').style.display = 'none';
  document.getElementById('sendBtn').disabled = false;
}

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + (type === 'user'? 'user-msg' : 'ai-msg');
  div.textContent = text;
  document.getElementById('chatBox').appendChild(div);
  document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
}
</script>
</body>
  </html>
